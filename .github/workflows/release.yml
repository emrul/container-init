name: Release

on:
  push:
    tags:
      - 'v*'
  # Called by auto-release.yml, whose GITHUB_TOKEN tag push can't
  # trigger the push event above.
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binaries
        run: make build VERSION=${{ env.TAG }}

      - name: Create GitHub release
        run: |
          gh release create ${{ env.TAG }} \
            --title "container-init ${{ env.TAG }}" \
            --generate-notes \
            bin/container-init.linux-amd64 \
            bin/container-init.linux-arm64 \
            bin/systemd1-shim.linux-amd64 \
            bin/systemd1-shim.linux-arm64
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
