name: Release

on:
  push:
    tags:
      - 'v*'
  # Called by auto-release.yml, whose GITHUB_TOKEN tag push can't
  # trigger the push event above.
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  # Build an existing tag with this workflow as it is on the chosen
  # branch: a dry run to test the workflow, or -- dry_run unticked -- to
  # publish a release whose tag-triggered run failed, after fixing the
  # workflow on main. (A tag-triggered run always uses the workflow as
  # it was at the tag, so it cannot pick up the fix.)
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, e.g. v1.2.0
        required: true
        type: string
      dry_run:
        description: Build only; do not create the release
        type: boolean
        default: true
  # A change to any workflow -- including a Dependabot actions bump --
  # runs the whole job on the PR's code, without publishing.
  pull_request:
    paths:
      - '.github/workflows/**'

env:
  # The tag to build and publish; empty on pull_request, which builds
  # the PR's code instead.
  TAG: ${{ github.event_name != 'pull_request' && (inputs.tag || github.ref_name) || '' }}
  DRY_RUN: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build binaries
        # Without a tag the Makefile's default (git describe) names the
        # version.
        run: |
          make build ${TAG:+VERSION="$TAG"}
          ./bin/container-init.linux-amd64 -version

      - name: Create GitHub release
        if: env.DRY_RUN != 'true'
        run: |
          gh release create "$TAG" \
            --title "container-init $TAG" \
            --generate-notes \
            bin/container-init.linux-amd64 \
            bin/container-init.linux-arm64 \
            bin/systemd1-shim.linux-amd64 \
            bin/systemd1-shim.linux-arm64
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}

      - name: Dry run -- not publishing
        if: env.DRY_RUN == 'true'
        run: |
          echo "Dry run (${{ github.event_name }}): built ${TAG:-the PR head}, not creating a release."
          ls -l bin/
