name: Go toolchain

# Dependabot doesn't bump the `toolchain` directive, which is what the
# release binaries are built with (setup-go reads go-version-file:
# go.mod). Stdlib advisories are the usual source of release-binary
# CVEs, so check weekly for a newer Go release and govulncheck against
# the pinned toolchain; open a PR when either needs action.

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare pinned toolchain with latest Go release
        id: ver
        run: |
          latest=$(curl -fsSL 'https://go.dev/VERSION?m=text' | head -1)
          current=$(sed -n 's/^toolchain //p' go.mod)
          echo "latest=$latest current=$current"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          if [ "$latest" != "$current" ]; then echo "bump=true" >> "$GITHUB_OUTPUT"; fi

      - if: steps.ver.outputs.bump == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.ver.outputs.latest }}

      - name: Bump, test, open PR
        if: steps.ver.outputs.bump == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.ver.outputs.latest }}
        run: |
          branch="deps/toolchain-$LATEST"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "$branch already open"; exit 0
          fi
          go get "toolchain@$LATEST"
          go mod tidy
          go vet ./...
          go test ./...
          make build
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git commit -am "build: go toolchain -> $LATEST"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "build: go toolchain -> $LATEST" \
            --body "Automated bump of the \`toolchain\` directive to $LATEST (picks up stdlib security fixes). vet, test and build passed in the toolchain workflow."

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
